name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-push-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Rust 1.85 workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check the declared MSRV
        run: cargo check --locked --workspace --all-targets

  check:
    name: Check, lint, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Pkl 0.31.1
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) pkl_os=macos ;;
            Linux) pkl_os=linux ;;
            *) echo "unsupported Pkl runner OS" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64) pkl_arch=amd64 ;;
            arm64|aarch64) pkl_arch=aarch64 ;;
            *) echo "unsupported Pkl runner architecture" >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/pkl" \
            "https://github.com/apple/pkl/releases/download/0.31.1/pkl-${pkl_os}-${pkl_arch}"
          chmod +x "$RUNNER_TEMP/pkl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run hermetic tests
        run: cargo test --locked --workspace --all-targets
      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps

  licenses:
    name: Third-party license attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.0
      - name: Regenerate third-party licenses
        run: scripts/regen-licenses.sh
      - name: Verify the committed report
        run: |
          if ! git diff --exit-code -- THIRD_PARTY_LICENSES.md; then
            echo "::error file=THIRD_PARTY_LICENSES.md::Out of date. Run scripts/regen-licenses.sh and commit the result." >&2
            exit 1
          fi
