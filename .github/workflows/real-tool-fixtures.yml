name: Real-tool fixtures

on:
  schedule:
    - cron: '23 7 * * 1' # Mondays, 07:23 UTC
  workflow_dispatch:
  # Exercise changes to the lane itself before merging them.
  pull_request:
    paths:
      - '.github/workflows/real-tool-fixtures.yml'
      - '.github/real-tools/**'
      - 'scripts/run-real-tool-fixtures.sh'
      - 'crates/velvet-glove/tests/tool_fixtures.rs'

permissions:
  contents: read

concurrency:
  group: real-tool-fixtures-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    name: Real tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Prepare artifact directory
        run: |
          mkdir -p "$RUNNER_TEMP/real-tool-fixtures"
          echo "VELVET_GLOVE_FIXTURE_ARTIFACT_DIR=$RUNNER_TEMP/real-tool-fixtures" >> "$GITHUB_ENV"
      - name: Install CI tools
        uses: jdx/mise-action@v4
        with:
          working_directory: .github/real-tools
          # Resolve floating patches afresh; do not restore stale tool installs.
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Run real-tool fixtures
        # Resolve tool paths explicitly before Cargo/fixtures change directories.
        run: mise -C .github/real-tools exec -- bash ../../scripts/run-real-tool-fixtures.sh
      - name: Summarize results
        if: always()
        run: python3 .github/real-tools/summary.py "$VELVET_GLOVE_FIXTURE_ARTIFACT_DIR" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports and failure workspaces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-tool-fixtures-${{ matrix.os }}
          path: ${{ env.VELVET_GLOVE_FIXTURE_ARTIFACT_DIR }}
          # Retain generated .velvet-glove policy and diagnostic artifacts.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
