name: Real-tool fixtures

on:
  schedule:
    - cron: '23 7 * * 1' # Mondays, 07:23 UTC
  workflow_dispatch:
  # Exercise changes to the lane, its fixtures, and builtin specs before
  # merging them. The lane runs only the CI-selected tools, so this is cheap.
  pull_request:
    paths:
      - '.github/workflows/real-tool-fixtures.yml'
      - '.github/real-tools/**'
      - 'scripts/run-real-tool-fixtures.sh'
      - 'crates/velvet-glove/tests/tool_fixtures.rs'
      - 'crates/velvet-glove/tests/tool-fixtures/**'
      - 'crates/hookkit-pkl-config/src/builtins/tools/**'

permissions:
  contents: read

concurrency:
  group: real-tool-fixtures-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    name: Real tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The broad tier installs ~90 best-effort tools (npm/pipx/gem/cargo/
    # go-install backends plus several language runtimes), which takes
    # longer than the small core tier alone.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Prepare artifact directory
        run: |
          mkdir -p "$RUNNER_TEMP/real-tool-fixtures"
          echo "VELVET_GLOVE_FIXTURE_ARTIFACT_DIR=$RUNNER_TEMP/real-tool-fixtures" >> "$GITHUB_ENV"
      - name: Select fixture tools
        # Select every fixture tool except a short, OS-aware exclusion
        # list. Only the core tier's tools are REQUIRED; anything else that
        # isn't installed reports a structured skip instead of failing the
        # job. Computed portably (no GNU-only `find` flags) since this runs
        # on both ubuntu-latest and macos-latest.
        #
        # Exclusions are fixture tools whose case cannot pass on hosted
        # runners for environmental reasons, each with its reason:
        #   - tsserver: mise's npm backend installs tsc-files with an
        #     isolated node_modules layout, under which tsc-files cannot find
        #     tsc and exits 0 (a documented tsc-files limitation; see
        #     tools/tsserver.pkl). Project-local npm installs work.
        # The first CI runs of the full catalog (2026-09-28, runs 36451989208
        # and 36456123824) also surfaced a loop-guard fingerprint bug and
        # syntax-error fixtures mislabelled as operational; both were fixed
        # in the runner and fixtures, so those tools are selected again.
        run: |
          exclude="tsserver"

          tools=""
          for dir in crates/velvet-glove/tests/tool-fixtures/*/; do
            name=$(basename "$dir")
            case ",$exclude," in
              *",$name,"*) continue ;;
            esac
            tools="${tools:+$tools,}$name"
          done
          echo "VELVET_GLOVE_FIXTURE_TOOLS=$tools" >> "$GITHUB_ENV"

          # The core tier (.github/real-tools/mise.toml), minus gomod-tidy
          # (needs the network) and taplo (lint only; taplo-format is required).
          required="actionlint,buf-format,buf-lint,cargo-check,cargo-clippy,cargo-fmt,go-fmt,go-vet,gofumpt,golangci-lint,hadolint,jq,pkl,pkl-format,ruff,ruff-format,rustfmt,shellcheck,shfmt,staticcheck,stylua,taplo-format,terraform,typos,yq"
          echo "VELVET_GLOVE_FIXTURE_REQUIRED_TOOLS=$required" >> "$GITHUB_ENV"
      - name: Install Rosetta 2 (macOS)
        # A handful of broad-tier tools (e.g. hlint) ship only an x86_64
        # macOS release asset; GitHub's macos-latest runners are arm64.
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Install OS packages (Linux)
        # xmllint has no mise/aqua backend; macOS already ships it, but
        # ubuntu-latest needs libxml2-utils from apt.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - name: Install CI tools (core, required)
        uses: jdx/mise-action@v4
        with:
          working_directory: .github/real-tools
          # Resolve floating patches afresh; do not restore stale tool installs.
          cache: false
      - name: Install CI tools (broad, best-effort)
        # A tool here that fails to resolve or install must not fail the
        # job: it becomes a structured executable-unavailable skip when its
        # fixture runs, instead of blocking every other broad-tier tool.
        continue-on-error: true
        uses: jdx/mise-action@v4
        with:
          working_directory: .github/real-tools/broad
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Run real-tool fixtures
        # Resolve both tiers' tool paths explicitly before Cargo/fixtures
        # change directories: `mise env` only adds absolute paths already
        # on disk, so it survives the script's later `cd`, unlike a shim
        # directory that re-resolves the active mise.toml from cwd.
        run: |
          eval "$(mise -C .github/real-tools env -s bash)"
          eval "$(mise -C .github/real-tools/broad env -s bash)"
          bash scripts/run-real-tool-fixtures.sh
      - name: Summarize results
        if: always()
        run: python3 .github/real-tools/summary.py "$VELVET_GLOVE_FIXTURE_ARTIFACT_DIR" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports and failure workspaces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-tool-fixtures-${{ matrix.os }}
          path: ${{ env.VELVET_GLOVE_FIXTURE_ARTIFACT_DIR }}
          # Retain generated .velvet-glove policy and diagnostic artifacts.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
