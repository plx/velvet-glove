[workspace]
resolver = "2"
members = [
    "crates/hookkit-pkl-config",
    "crates/hookkit-tool-runner",
    "crates/velvet-glove",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/plx/velvet-glove"
rust-version = "1.85.0"

[workspace.dependencies]
camino = { version = "1", features = ["serde1"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
# 0.4.19+ raised the crate's MSRV above the Rust 1.85 baseline.
globset = "=0.4.18"
minijinja = "2"
proptest = "1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wait-timeout = "0.2"
walkdir = "2"

# Velvet Glove owns its policy loader and quality-runner implementation.
hookkit-pkl-config = { version = "0.1.0", path = "crates/hookkit-pkl-config" }
hookkit-tool-runner = { version = "0.1.0", path = "crates/hookkit-tool-runner" }

# HookKit is not published yet, so the remaining framework crates are pinned
# to the exact public Git revision used to generate this project.
hookkit-antigravity = { git = "https://github.com/plx/agent-hook-kit", rev = "83c49d46970602e8fb40a8afaeea521dfb7e9b61" }
hookkit-claude = { git = "https://github.com/plx/agent-hook-kit", rev = "83c49d46970602e8fb40a8afaeea521dfb7e9b61" }
hookkit-codex = { git = "https://github.com/plx/agent-hook-kit", rev = "83c49d46970602e8fb40a8afaeea521dfb7e9b61" }
hookkit-common = { git = "https://github.com/plx/agent-hook-kit", rev = "83c49d46970602e8fb40a8afaeea521dfb7e9b61" }
hookkit-core = { git = "https://github.com/plx/agent-hook-kit", rev = "83c49d46970602e8fb40a8afaeea521dfb7e9b61" }
hookkit-file-activity = { git = "https://github.com/plx/agent-hook-kit", rev = "83c49d46970602e8fb40a8afaeea521dfb7e9b61" }
hookkit-runtime = { git = "https://github.com/plx/agent-hook-kit", rev = "83c49d46970602e8fb40a8afaeea521dfb7e9b61" }
hookkit-session-state = { git = "https://github.com/plx/agent-hook-kit", rev = "83c49d46970602e8fb40a8afaeea521dfb7e9b61" }
