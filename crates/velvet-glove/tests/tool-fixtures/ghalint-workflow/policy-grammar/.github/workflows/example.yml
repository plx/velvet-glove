name: policy grammar
on:
  push:
env:
  GLOBAL_SECRET: ${{ secrets.GLOBAL_SECRET }}
  GLOBAL_TOKEN: ${{ github.token }}
permissions: {}
jobs:
  reusable:
    uses: example/reusable/.github/workflows/check.yml@main
    permissions: {}
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: unpinned action
        id: unpinned
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: under-scoped app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
