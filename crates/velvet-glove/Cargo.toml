[package]
name = "velvet-glove"
version = "0.1.0"
edition = "2024"
description = "Deferred linting and formatting for coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/plx/velvet-glove"
rust-version = "1.85.0"
publish = false

[[bin]]
name = "velvet-glove"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
hookkit-common = { workspace = true }
hookkit-core = { workspace = true }
hookkit-file-activity = { workspace = true }
hookkit-runtime = { workspace = true }
hookkit-session-state = { workspace = true }
hookkit-tool-runner = { workspace = true }

[lints.rust]
unsafe_code = "forbid"


[dev-dependencies]
hookkit-pkl-config = { workspace = true }
serde_json = { workspace = true }
